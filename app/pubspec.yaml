name: omnitask_local
description: "Omnitask Local — приватный local-first менеджер задач для Windows и Android."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Локальное хранилище: SQLite в выбранной пользователем папке (vault).
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

  # Состояние приложения.
  provider: ^6.1.2

  # Папки/пути: выбор хранилища на Windows, стандартные каталоги на Android.
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Форматирование дат (ru).
  intl: ^0.19.0

  # Markdown-предпросмотр описания задачи.
  flutter_markdown: ^0.7.4

  # Локальные уведомления о дедлайнах.
  flutter_local_notifications: ^17.2.3
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
